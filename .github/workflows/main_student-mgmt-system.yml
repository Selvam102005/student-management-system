name: Build and deploy Node.js app to Azure Web App - student-mgmt-system

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Build frontend
      - name: Install and build frontend
        working-directory: ./Frontend
        run: |
          npm install
          npm run build

      # Install backend dependencies
      - name: Install backend
        working-directory: ./Backend
        run: npm install

      # Copy frontend build into backend (for hosting)
      - name: Move frontend build to backend
        run: |
          cp -r Frontend/build Backend/

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./Backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E71B28ED590F4CF588AAB1DBDA3FA9D9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_615B81042E3344E2AE11FDAC6976EFEA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4F77551003E44860B97FECFA61D9AD1B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'student-mgmt-system'
          slot-name: 'Production'
          package: .

name: Build and Deploy Student Management System to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3️⃣ Install and build frontend
      - name: Install and build frontend
        working-directory: ./Frontend
        run: |
          npm install
          npm run build
          ls -la

      # 4️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./Backend
        run: npm install

      # 5️⃣ Copy frontend build into backend
      - name: Copy frontend build into backend
        run: cp -r Frontend/dist/. Backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      # 1️⃣ Login to Azure safely using secrets
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2️⃣ Deploy backend folder to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'student-mgmt-system' # Your Azure Web App name
          slot-name: 'Production'
          package: ./Backend

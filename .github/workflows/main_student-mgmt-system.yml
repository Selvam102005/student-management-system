name: Build and Deploy Student Management System to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3️⃣ Install and build frontend
      - name: Install and build frontend
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build
          ls -la dist

      # 4️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./Backend
        run: npm ci

      # 5️⃣ Copy frontend build into backend
      - name: Copy frontend build into backend
        run: |
          mkdir -p Backend/Frontend_dist
          cp -r Frontend/dist/. Backend/Frontend_dist/
          ls -la Backend/Frontend_dist

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      # 6️⃣ Checkout code again (needed for deploy job)
      - name: Checkout code
        uses: actions/checkout@v4

      # 7️⃣ Login to Azure using AZURE_CREDENTIALS secret
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 8️⃣ Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'student-mgmt-system' # Your Azure Web App name
          slot-name: 'Production'
          package: ./Backend
